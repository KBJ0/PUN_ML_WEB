{% extends "base.html" %}

{% block content %}
<div class="container">
  <h1>✅ 전처리 완료</h1>

  <div class="card">
    <h2>결과 요약</h2>
    <ul>
      <li><strong>원본 데이터:</strong> {{ original_shape }}</li>
      <li><strong>처리 후 데이터:</strong> {{ processed_shape }}</li>
      <li><strong>저장 경로:</strong> {{ processed_path }}</li>
    </ul>
  </div>

  <div class="card">
    <h2>처리된 데이터 미리보기 (상위 5개)</h2>
    <div class="table-container">
      {{ df_preview|safe }}
    </div>
  </div>

  <div class="next-step">
      <h2>다음 단계</h2>
      <a href="#" class="button-disabled">모델 학습 시작하기 (구현 예정)</a>
      <a href="/data/upload" class="button-secondary">다른 파일 업로드</a>
  </div>

</div>
{% endblock %}

{% block head_extra %}
<style>
  .container { max-width: 1200px; margin: 2rem auto; padding: 1rem; }
  .card { background-color: #f9f9f9; border: 1px solid #ddd; border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; }
  .table-container { overflow-x: auto; }
  .table { width: 100%; border-collapse: collapse; }
  .table th, .table td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; }
  .next-step { text-align: center; margin-top: 2rem; }
  .next-step a { margin: 0 0.5rem; }
  .button-disabled { background-color: #ccc; color: #666; cursor: not-allowed; padding: 0.75rem 1.5rem; text-decoration: none; border-radius: 5px; }
  .button-secondary { background-color: #6c757d; color: white; padding: 0.75rem 1.5rem; text-decoration: none; border-radius: 5px; }
</style>
{% endblock %}
